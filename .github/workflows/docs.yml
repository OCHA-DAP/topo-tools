name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - "plugins/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger topo-tools-js deploy
        env:
          TOKEN: ${{ secrets.JS_DISPATCH_TOKEN }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/OCHA-DAP/topo-tools-js/dispatches \
            -d '{"event_type":"py-docs-updated"}'
