name: Update Homebrew tap

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-homebrew-tap:
    runs-on: macos-latest
    outputs:
      bumped: ${{ steps.tap.outputs.newer }}
      branch: bump-topo-tools-${{ steps.pypi.outputs.version }}
    steps:
      - name: Checkout topo-tools
        uses: actions/checkout@v7

      # brew bump-formula-pr resolves deps with --uploaded-prior-to=P1D, so a
      # release under a day old can't be found yet.
      - name: Latest PyPI version older than 1 day
        id: pypi
        run: |
          set -euo pipefail
          version=$(curl -sf https://pypi.org/pypi/topo-tools/json | jq -r '
            (now - 86400) as $cutoff
            | .releases | to_entries
            | map(select(
                (.key | test("^[0-9]+(\\.[0-9]+)*$"))
                and (.value | length > 0)
                and (.value | all(
                  (.yanked | not)
                  and ((.upload_time_iso_8601 | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff)
                ))
              ))
            | sort_by(.key | split(".") | map(tonumber))
            | last | .key // empty')
          [ -n "$version" ] || { echo "No topo-tools release older than 1 day"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tap OCHA-DAP/homebrew-topo-tools
        run: brew tap OCHA-DAP/topo-tools

      - name: Current tap version
        id: tap
        run: |
          version=$(brew info --json=v2 OCHA-DAP/topo-tools/topo-tools | jq -r '.formulae[0].versions.stable')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Bump only to a newer release; the tap can be ahead of PyPI's 1-day cutoff.
          pypi="${{ steps.pypi.outputs.version }}"
          newest=$(printf '%s\n%s\n' "$version" "$pypi" | sort -V | tail -1)
          if [ "$pypi" != "$version" ] && [ "$newest" = "$pypi" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete a stale bump branch from an unmerged earlier run
        if: steps.tap.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          ref="heads/bump-topo-tools-${{ steps.pypi.outputs.version }}"
          if gh api "repos/OCHA-DAP/homebrew-topo-tools/git/ref/$ref" > /dev/null 2>&1; then
            gh api -X DELETE "repos/OCHA-DAP/homebrew-topo-tools/git/refs/$ref"
          fi

      - name: Open Homebrew formula bump PR
        if: steps.tap.outputs.newer == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew bump-formula-pr \
            --no-fork \
            --no-browse \
            --install-dependencies \
            --version="${{ steps.pypi.outputs.version }}" \
            OCHA-DAP/topo-tools/topo-tools

      - name: Sync duckdb wheel resource on bump branch
        if: steps.tap.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          branch="bump-topo-tools-${{ steps.pypi.outputs.version }}"
          workdir="$(mktemp -d)"

          git clone --branch "$branch" --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/OCHA-DAP/homebrew-topo-tools.git" \
            "$workdir"

          python3 "$GITHUB_WORKSPACE/.github/scripts/sync_duckdb_wheel.py" \
            "$workdir/Formula/topo-tools.rb"

          git -C "$workdir" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "duckdb: pin to prebuilt macOS universal2 and manylinux wheels"

          git -C "$workdir" push origin "HEAD:$branch"

      - name: Install and test bump branch
        if: steps.tap.outputs.newer == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          tap="$(brew --repository OCHA-DAP/topo-tools)"
          git -C "$tap" fetch origin "bump-topo-tools-${{ steps.pypi.outputs.version }}"
          git -C "$tap" checkout -f -B "bump-topo-tools-${{ steps.pypi.outputs.version }}" FETCH_HEAD
          brew install --build-from-source OCHA-DAP/topo-tools/topo-tools
          brew test OCHA-DAP/topo-tools/topo-tools

  test-linux:
    needs: update-homebrew-tap
    if: needs.update-homebrew-tap.outputs.bumped == 'true'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install and test bump branch
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew tap OCHA-DAP/topo-tools
          tap="$(brew --repository OCHA-DAP/topo-tools)"
          git -C "$tap" fetch origin "${{ needs.update-homebrew-tap.outputs.branch }}"
          git -C "$tap" checkout -f -B "${{ needs.update-homebrew-tap.outputs.branch }}" FETCH_HEAD
          brew install --build-from-source OCHA-DAP/topo-tools/topo-tools
          brew test OCHA-DAP/topo-tools/topo-tools

  merge:
    needs: [update-homebrew-tap, test-linux]
    if: needs.update-homebrew-tap.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge Homebrew formula bump PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch \
            --repo OCHA-DAP/homebrew-topo-tools \
            "${{ needs.update-homebrew-tap.outputs.branch }}"
