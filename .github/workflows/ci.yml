name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run lint-imports
      - run: uv run python .github/scripts/gen_reference.py --check

  skill-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check skill links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --remap "https://raw.githubusercontent.com/OCHA-DAP/topo-tools/main/(.*) file://${{ github.workspace }}/\$1"
            'plugins/**/*.md'
          lycheeVersion: v0.24.2

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          base=HEAD^1
          if [ "${{ github.event_name }}" = push ]; then
            base="${{ github.event.before }}"
            git fetch -q --depth=1 origin "$base" || base=
          fi
          if [ -z "$base" ] || git diff --name-only "$base" HEAD |
            grep -qE '^(topo_tools/|tests/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - run: uv run pytest

  tests:
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.changes.result }}" = success
          test "${{ needs.test.result }}" = success -o "${{ needs.test.result }}" = skipped
