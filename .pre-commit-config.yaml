default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: reference-pages
        name: reference pages match CLI help
        entry: uv run python .github/scripts/gen_reference.py --check
        language: system
        files: ^(topo_tools/cli/|docs/pages/.*/reference/|\.github/scripts/gen_reference\.py$)
        pass_filenames: false
      - id: skill-links
        name: skill-links (lychee)
        entry: .github/scripts/check_skill_links.sh
        language: script
        files: ^plugins/.*\.md$
      - id: no-push-to-finished-pr
        name: don't push to a branch whose PR is merged or closed
        language: system
        entry: bash -c 'state=$(gh pr view --json state -q .state 2>/dev/null); case "$state" in MERGED|CLOSED) echo "This branch'"'"'s PR is $state. Branch off main instead."; exit 1;; esac'
        stages: [pre-push]
        pass_filenames: false
        always_run: true
