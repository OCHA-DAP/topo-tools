[project]
name = "topo-tools"
version = "0.17.0"
description = "DuckDB-powered geospatial topology utilities (edge-matching, topology cleaning, more)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxym Malynowsky", email = "maxym.malynowsky@un.org" }]
requires-python = ">=3.10"
dependencies = ["click", "duckdb>=1.5.6", "psutil"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/OCHA-DAP/topo-tools-py"
Documentation = "https://ocha-dap.github.io/topo-tools-js/tools/docs/"
Repository = "https://github.com/OCHA-DAP/topo-tools-py"
Issues = "https://github.com/OCHA-DAP/topo-tools-py/issues"

[project.scripts]
topo-tools = "topo_tools.cli.main:cli"

[dependency-groups]
dev = ["import-linter", "pre-commit", "pytest", "pytest-xdist", "ruff"]

[tool.pytest.ini_options]
addopts = "-n auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
